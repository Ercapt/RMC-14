- type: entity
  parent: BaseStructureDynamic
  id: RMCSmallFloodlight
  name: маленький прожектор
  description: Маленький промінь світла в непроглядній темряві.
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags:
    - Anchorable
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlight.rsi
    layers:
      - state: smallfloodon # Temporary until power works.
      - state: smallflood
        visible: false
        map: [ "light" ]
  - type: InteractionOutline
  - type: Repairable
  - type: Damageable
    damageContainer: Inorganic
  - type: PointLight
    enabled: true
    radius: 6
    netsync: false
    energy: 2
    offset: "0, 0"
    color: "#ECFFFF"
    mask: /Textures/_RMC14/Effects/LightMasks/quad_cone.png
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CMSheetMetal1:
            min: 1
            max: 1
          CMSheetGlass1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 50
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Appearance

- type: entity
  parent: BaseStructure
  id: RMCTallFloodlight
  name: високий прожектор
  description: Стовп світла що розвіює темряву.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags:
    - Anchorable
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlightbig.rsi
    layers:
      - state: bigflood
      - state: bigfloodon
        visible: false
        map: [ "light" ]
    offset: "0.0,0.5"
    drawdepth: Mobs
  - type: Construction
    graph: RMCFloodlightBroken
    node: completed
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
  - type: PointLight
    enabled: false
    radius: 7
    netsync: false
    offset: "0,0.5"
    color: "#ECFFFF"
    mask: /Textures/_RMC14/Effects/LightMasks/quad_cone.png
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
  - type: Repairable
  - type: Corrodible # Repairable, not destructible.
    isCorrodible: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 50
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Appearance
  - type: ToggleableLightVisuals
    spriteLayer: light
  - type: RMCReactorPoweredLight
  - type: PreventAttackLightOff
  - type: RequireProjectileTarget

- type: entity
  parent: BaseStructure
  id: RMCFloodlightBroken
  name: високий пошкоджений прожектор
  description: На ньому приварена табличка 'Щоб полагодити, відкрутіть панель, вийміть пошкоджений вузол ломом, приваріть його на місце, замініть 2 кабелі після чого закрийте панель.'
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags:
    - Anchorable
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlightbig.rsi
    state: broken
    offset: "0.0,0.5"
    drawdepth: Mobs
  - type: Construction
    graph: RMCFloodlightBroken
    node: start
  - type: InteractionOutline
  - type: Corrodible # Repairable, not destructible.
    isCorrodible: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 155
        mask:
        - MachineMask
        layer:
        - WallLayer

# LZ Floodlights

- type: entity
  parent: BaseStructure
  id: RMCLZFloodlight
  name: прожектор для посадки
  description: Сильне джерело світла що зазвичай розташоване поблизу посадкових зон для покращення видимості. Цей прожектор здається добре зафіксований болтами і його неможливо пересунути.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/floodlight.rsi
    state: magical
  - type: InteractionOutline
  - type: PointLight
    enabled: true
    radius: 6
    energy: 2
    netsync: false
    color: "#ECFFFF"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 50
        mask:
        - HighImpassable
  - type: Corrodible
    isCorrodible: false
  - type: Appearance

# Engineer Ship Light

- type: entity
  parent: RMCLZFloodlight
  id: RMCEngineerShipLight
  name: кругове світло
  description: Великий круглий світильник
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Lights/engineer_ship.rsi
    state: engineerlight_on
  - type: PointLight
    enabled: true
    radius: 14
    energy: 3
    color: "#00FFA0"

# Street

- type: entity
  parent: RMCTallFloodlight
  id: RMCStreetlight
  name: вуличний ліхтар колонії
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        density: 50
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/streetlight.rsi
    offset: 0.0,0.8
    layers:
      - state: street_off
      - state: street_on
        visible: false
        map: [ "light" ]
    drawdepth: Mobs
  - type: Construction
    graph: RMCStreetlightBroken
    node: completed

- type: entity
  parent: RMCFloodlightBroken
  id: RMCStreetlightBroken
  name: зламаний вуличний ліхтар колонії
  description: На ньому приварена табличка 'Щоб полагодити, відкрутіть панель, вийміть пошкоджений вузол ломом, приваріть його на місце, замініть 2 кабелі після чого закрийте панель.'
  components:
  - type: Sprite
    noRot: true
    sprite: _RMC14/Objects/Misc/Lights/streetlight.rsi
    offset: 0.0,0.8
    state: broken
    drawdepth: Mobs
  - type: Construction
    graph: RMCStreetlightBroken
    node: start
